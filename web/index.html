<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#007AFF">
  <meta name="description" content="Smart Gym Tracker — entrena con sobrecarga progresiva.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Smart Gym">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Smart Gym Tracker</title>
  <link rel="manifest" href="manifest.json">

  <!-- Prefetch (no preload) del runtime de drift en web. La app abre la
       base local lazy en el primer query (LazyDatabase), pero estos
       binarios pesan ~1.8 MB combinados. `prefetch` hace que el browser
       los baje en idle después del primer paint, así el render inicial
       no compite por bandwidth y cuando el usuario interactúa con datos
       locales ya están cacheados. Combinado con Cache-Control immutable
       en firebase.json, en visitas siguientes son 0 bytes. -->
  <link rel="prefetch" href="sqlite3.wasm" as="fetch" crossorigin="anonymous">
  <link rel="prefetch" href="drift_worker.dart.js" as="script">

  <style>
    /* Fondo blanco antes de que Flutter pinte. Sin esto, en navegadores con
       OS en modo oscuro el body aparece gris/negro durante el bootstrap, y
       cualquier `BackdropFilter` que samplee fuera del canvas hereda ese
       color. */
    html, body { background-color: #FFFFFF; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
