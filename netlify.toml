# Hosting de la web. Netlify construye en cada push a main (producción) y en
# cada PR (deploy preview). Credenciales: variables de entorno del sitio
# SUPABASE_URL y SUPABASE_ANON_KEY (ver scripts/netlify_build.sh).
[build]
  command = "bash scripts/netlify_build.sh"
  publish = "build/web"

[build.environment]
  FLUTTER_VERSION = "3.38.9"

# SPA: las rutas de go_router caen en index.html (los ficheros reales ganan).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Arranque siempre fresco. sqlite3.wasm y el worker no llevan versión en el
# nombre: un día de caché, o tras subir `sqlite3` el navegador mezclaría
# binarios (LinkError en la primera consulta).
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/main.dart.*"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sqlite3.wasm"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/drift_worker.dart.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
