# Lints + analyzer estrictos para el remaster.
# Lo que aquí entra deja de ser opcional: cualquier PR que rompa estos checks
# falla CI.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    - prefer_const_constructors
    - prefer_const_literals_to_create_immutables
    - avoid_dynamic_calls
    - unawaited_futures
    - require_trailing_commas
    - cancel_subscriptions
    - close_sinks
    - avoid_returning_null_for_future
    - avoid_slow_async_io
    - prefer_single_quotes
