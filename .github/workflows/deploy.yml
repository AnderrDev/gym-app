name: Deploy (Supabase)

# Despliega migraciones y edge functions al mergear a main. La web la
# construye y publica Netlify (ver netlify.toml).
#
# Secrets requeridos en el repo:
#   SUPABASE_ACCESS_TOKEN   — para `supabase` CLI
#   SUPABASE_PROJECT_REF    — ej. benadgxgowycjxypyunc
#   SUPABASE_DB_PASSWORD    — para `supabase db push`

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Sin secretos (hoy las migraciones se aplican a mano) los jobs se omiten
  # en vez de dejar main en rojo en cada push.
  check-secrets:
    name: Check Supabase secrets
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SUPABASE_ACCESS_TOKEN vacío: no se despliegan migraciones ni Edge Functions."
          fi

  deploy-db:
    name: Apply DB migrations
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Login
        run: supabase login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Push migrations
        run: supabase db push --password "${{ secrets.SUPABASE_DB_PASSWORD }}"

  deploy-functions:
    name: Deploy Edge Functions
    runs-on: ubuntu-latest
    needs: deploy-db
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Login
        run: supabase login --token "${{ secrets.SUPABASE_ACCESS_TOKEN }}"
      - name: Link
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}"
      - name: Deploy finalize
        run: supabase functions deploy finalize_workout_session_v1
      - name: Deploy generate_coaching
        run: supabase functions deploy generate_coaching_v1
      - name: Deploy weekly insights
        run: supabase functions deploy get_weekly_insights_v1
      - name: Deploy delete account
        run: supabase functions deploy delete_account_v1
