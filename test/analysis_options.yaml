# Relajación local para los tests. Heredamos el lint set del root, pero
# silenciamos los strict-inference checks que aquí no aportan: el tipo
# se infiere por el contexto inmediato (matchers, fallback values, etc.)
# y forzar `Right<Failure, X>(...)` solo añade ruido.

include: ../analysis_options.yaml

analyzer:
  errors:
    inference_failure_on_instance_creation: ignore
    inference_failure_on_collection_literal: ignore
    inference_failure_on_function_invocation: ignore
